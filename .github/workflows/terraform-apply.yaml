name: Terraform Apply

on:
  push:
    branches: [ main ]
    paths:
      - 'main/**'
      - '.github/workflows/terraform-apply.yaml'

env:
  TF_VERSION: '1.16.3'
  WORKING_DIR: 'main'

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write SA key
        run: |
          cat > /tmp/sa-key.json <<'EOF'
          ${{ secrets.YC_SA_KEY }}
          EOF
          chmod 600 /tmp/sa-key.json
          echo "SA key size: $(wc -c < /tmp/sa-key.json) bytes"

      - name: Write SSH public key
        run: |
          mkdir -p /tmp/ssh
          cat > /tmp/ssh/id_ed25519.pub <<'EOF'
          ${{ secrets.SSH_PUBLIC_KEY }}
          EOF
          chmod 600 /tmp/ssh/id_ed25519.pub
          echo "SSH key size: $(wc -c < /tmp/ssh/id_ed25519.pub) bytes"

      - name: Write backend config
        run: |
          cat > backend.conf <<EOF
          access_key = "${{ secrets.YC_SA_KEY_ID }}"
          secret_key = "${{ secrets.YC_SA_SECRET }}"
          EOF
          cat backend.conf

      - name: Terraform Init
        run: terraform init -backend-config=backend.conf

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_service_account_key_file: /tmp/sa-key.json
          TF_VAR_ssh_public_key_file: /tmp/ssh/id_ed25519.pub
